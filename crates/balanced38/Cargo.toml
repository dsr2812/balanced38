[package]
name = "balanced38"
version = "1.2.1"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "An exact, honest, balanced signed base-38 integer lane: every i128 has exactly one membrane form, the carry law is compare-and-add-38, and the checked doors refuse loudly. Its algebraic laws and signed-i128 refusal contract are formally verified in Lean (core-only, 0 sorries) for the mathematical lane, with the Rust implementation tested against them."
readme = "README.md"
documentation = "https://docs.rs/balanced38"
repository = "https://github.com/dsr2812/balanced38"
keywords = ["base38", "balanced", "integer", "arithmetic", "exact"]
categories = ["mathematics", "data-structures"]

[dependencies]
smallvec = { version = "1", features = ["const_new"] }