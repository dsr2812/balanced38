[package]
name = "libb38"
version = "0.3.2"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "A drop-in exact-arithmetic layer: balanced base-38 strings in, exact sum out. C-ABI, no runtime. The C-ABI key to the balanced base-38 lane."
readme = "README.md"
documentation = "https://docs.rs/libb38"
repository = "https://github.com/dsr2812/balanced38"
keywords = ["base38", "c-abi", "ffi", "exact-arithmetic", "string"]
categories = ["external-ffi-bindings", "mathematics"]

[dependencies]
balanced38 = { version = "1.2.1", path = "../balanced38" }
smallvec = { version = "1", features = ["const_new"] }

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]